<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192127"><meta name="description" content="A simple, live computer vision experience.">
<title>Computer Vision</title><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="vendor/tf.min.js"></script><script type="module" src="app.js"></script>
</head>
<body>
<main class="experience">
 <div class="stage-shell">
  <section class="stage" aria-label="Video and object detections">
   <div id="picture"><video id="video" autoplay muted playsinline preload="auto" poster="media/heb-people-poster.jpg"></video><canvas id="delayed-video" aria-hidden="true" hidden></canvas><img id="sample-image" alt="" hidden><div id="overlays" aria-hidden="true"></div></div>
   <button id="flip-camera" class="icon-button flip-camera" aria-label="Flip camera" title="Flip camera" hidden><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5" />
  <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5" />
  <circle cx="12" cy="12" r="3" />
  <path d="m18 22-3-3 3-3" />
  <path d="m6 2 3 3-3 3" />
</svg></button>
  </section>
 </div>
 <aside class="recognition">
  <div class="recognition-content">
   <header><h1 class="status"><span id="status-dot" class="loading" aria-hidden="true"></span><span id="status-text" role="status" aria-live="polite">Loading Computer Vision</span></h1><button id="retry" hidden>Try again</button></header>
   <div id="rows" role="list" aria-label="Object recognition"></div>
  </div>
  <div class="bottom-controls">
   <div class="source" role="group" aria-label="Video source">
    <button id="camera" aria-pressed="false"><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" />
  <circle cx="12" cy="13" r="3" />
</svg>Camera</button>
    <button id="demo" aria-pressed="true"><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
</svg>Demo</button>
   </div>
   <button id="open-settings" class="icon-button" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings" title="Settings"><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M10 5H3" />
  <path d="M12 19H3" />
  <path d="M14 3v4" />
  <path d="M16 17v4" />
  <path d="M21 12h-9" />
  <path d="M21 19h-5" />
  <path d="M21 5h-7" />
  <path d="M8 10v4" />
  <path d="M8 12H3" />
</svg></button>
  </div>
 </aside>
</main>
<dialog id="settings" aria-labelledby="settings-title">
 <div class="settings-header"><h2 id="settings-title">Settings</h2><button id="close-settings" class="icon-button" aria-label="Close settings" autofocus><svg aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M18 6 6 18" />
  <path d="m6 6 12 12" />
</svg></button></div>
 <div class="settings-content">
  <section id="demo-options" class="settings-section" aria-labelledby="scenes-title"><h3 id="scenes-title">Demo scene</h3><div id="demo-clips" class="demo-clips" role="group" aria-label="Sample scene"></div><label id="auto-rotate-option" class="check-option"><input id="auto-rotate" type="checkbox" checked> Auto-rotate videos</label></section>
  <fieldset id="detection-options" class="settings-section"><legend>Detect</legend></fieldset>
  <section class="settings-section tuning" aria-labelledby="display-title">
   <h3 id="display-title">Display tuning</h3>
   <label class="check-option"><input id="box-glow" type="checkbox"> Object glow</label>
   <label class="range-label" for="detection-fps">Detection FPS <output id="fps-value" for="detection-fps">8</output></label><input id="detection-fps" type="range" min="2" max="20" step="1" value="8">
   <label class="check-option"><input id="box-fill" type="checkbox" checked> Overlay background</label>
   <label class="range-label" for="fill-opacity">Background opacity <output id="fill-value" for="fill-opacity">40%</output></label><input id="fill-opacity" type="range" min="0" max="100" step="1" value="40">
   <label class="range-label" for="playback-delay">Playback delay <output id="delay-value" for="playback-delay">0.20 s</output></label><input id="playback-delay" type="range" min="0" max="0.50" step="0.01" value="0.20" aria-describedby="delay-help">
   <small id="delay-help">Delays the displayed video, not its speed. 0.00 turns buffering off.</small>
  </section>
 </div>
</dialog>
</body></html>
