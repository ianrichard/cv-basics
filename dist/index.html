<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192127"><meta name="description" content="A simple, live computer vision experience."><title>Computer Vision</title><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="vendor/tf.min.js"></script><script type="module" src="app.js"></script></head>
<body><main class="experience"><section class="stage" aria-label="Video and object detections"><div id="picture"><video id="video" autoplay muted playsinline preload="auto" poster="media/heb-people-poster.jpg"></video><div id="overlays" aria-hidden="true"></div></div><button id="flip-camera" class="flip-camera" aria-label="Flip camera" title="Flip camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 8a8 8 0 00-14-3L3 8m0-5v5h5M4 16a8 8 0 0014 3l3-3m0 5v-5h-5"/></svg></button><div id="notice" role="status"><span id="notice-text">Preparing detection…</span><button id="retry" hidden>Try again</button></div></section><aside class="ledger"><header><h1>Computer Vision</h1><p class="status" role="status"><span id="status-dot"></span><span id="status-text">Getting ready</span></p></header><div id="rows" aria-label="Current object counts"></div><div class="total"><span>Total fruit</span><output id="total">0</output></div><p id="scene-note" class="scene-note"></p><div class="source" role="group" aria-label="Video source"><button id="camera" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 5l1.5-2h5L16 5h4a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V7a2 2 0 012-2z"/><circle cx="12" cy="12" r="4"/></svg>Camera</button><button id="demo" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3l14 9-14 9z"/></svg>Demo</button></div><div id="demo-clips" class="demo-clips" role="group" aria-label="Detection scene"></div></aside></main></body></html>
